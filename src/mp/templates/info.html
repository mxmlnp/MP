<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скоро здесь будет больше информации</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #eef2f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(30, 64, 175, 0.12);
            border: 1px solid #e3ecfb;
            max-width: 460px;
            width: 100%;
            text-align: center;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            margin: 0 auto 22px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 12px;
            font-weight: 700;
            line-height: 1.3;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Кнопки */
        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .btn-primary {
            color: #ffffff;
            background: #2563eb;
            border: none;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-outline {
            color: #2563eb;
            background: #ffffff;
            border: 1.5px solid #2563eb;
        }

        .btn-outline:hover {
            background: #eff6ff;
        }

        .btn-outline:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 32px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-mark">И</div>
        <h1>Скоро здесь будет больше информации</h1>
        <p class="subtitle">Мы работаем над этим. А пока вы можете войти или создать аккаунт.</p>

        <div class="actions">
            <a href="/reg" class="btn btn-primary">Зарегистрироваться</a>
            <a href="/login" class="btn btn-outline">Войти</a>
        </div>

        <div class="footer">
            © 2026 Все права защищены.
        </div>
    </div>
</body>
</html>
