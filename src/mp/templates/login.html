<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #eef2f9;
            color: #1e293b;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 45px 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(30, 64, 175, 0.12);
            border: 1px solid #e3ecfb;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            margin: 0 auto 24px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1e293b;
            text-align: center;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            letter-spacing: 0.2px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            background: #f8fafc;
            color: #1e293b;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.98);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0 18px;
            color: #cbd5e1;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            padding: 0 12px;
            color: #94a3b8;
        }

        .links {
            display: flex;
            justify-content: center;
            font-size: 14px;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .links a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .footer {
            margin-top: 28px;
            color: #94a3b8;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-mark">В</div>
        <h1>Вход в аккаунт</h1>
        <p class="subtitle">Введите свои данные, чтобы продолжить</p>

        <form action="#" method="post">
            <div class="form-group">
                <label for="username">Логин или email</label>
                <input type="text" id="username" name="username" placeholder="Введите ваш логин" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit">Войти</button>
        </form>

        <div class="divider"><span>или</span></div>

        <div class="links">
            <a href="/reg">Зарегистрироваться</a>
        </div>

        <div class="footer">
            © 2026 Все права защищены.
        </div>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</html>
